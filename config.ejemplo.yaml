# =============================================================================
# config.ejemplo.yaml
# -----------------------------------------------------------------------------
# Plantilla de configuración para instalar el sistema en OTRA empresa.
# Copia este archivo como "config.yaml" (en la raíz del proyecto, junto a
# procesar.py) y reemplaza cada valor de ejemplo por el dato real de la
# empresa que estás dando de alta. "config.yaml" NUNCA se sube al repositorio
# (ver .gitignore) porque contiene los IDs de los Google Sheets del negocio.
#
# Los datos de este archivo son FICTICIOS (empresa de ejemplo "LA CALETA").
# No los uses tal cual: son solo para mostrar la forma que debe tener cada
# campo.
# =============================================================================

# Nombre corto del negocio. Se usa en logs y en el asunto de los Sheets que
# crea init_negocio.py. Una sola palabra o pocas, en mayúsculas, sin tildes.
negocio: LA CALETA

# Cuenta de Google dedicada y exclusiva de este negocio (ver paso 0 de
# ONBOARDING.md). Es la cuenta dueña de la carpeta de Drive del negocio y
# con la que se generaron las credenciales OAuth. Debe ser una cuenta que NO
# se comparta con otro negocio ni con el uso personal de nadie.
cuenta_google: administracion.lacaleta@gmail.com

# Carpetas de trabajo en Google Drive. El sistema habla directo con la API
# de Drive (no hace falta instalar Google Drive para escritorio en la
# máquina que corre el sistema). "raiz_nombre" es el único campo de texto
# editable: el nombre que va a tener la carpeta raíz del negocio dentro de
# "Mi unidad" de la cuenta de Google del Paso 0. Las 4 subclaves de
# "carpetas" son IDs de Drive, no nombres ni rutas: se dejan vacías acá y
# las rellena init_negocio.py la primera vez que se corre (crea la carpeta
# raíz y las subcarpetas 00_BUZON/01_PROCESADO/02_REVISAR por API si no
# existen, y guarda sus ids aquí). No los llenes a mano.
drive:
  raiz_nombre: LA CALETA
  carpetas:
    raiz: ""
    buzon: ""
    procesado: ""
    revisar: ""
    # Subcarpetas de 00_BUZON, una por tipo de documento. La subcarpeta donde
    # se deja el archivo le dice al sistema QUÉ es — dato que el documento no
    # siempre trae:
    #   facturas       comprobantes normales (foto, xml, pdf)
    #   notas_venta    respaldos de gastos de caja chica (foto, pdf, xls);
    #                  NO se leen con el modelo: el dato vive en el reporte de
    #                  egresos del sistema de ventas
    #   liquidaciones  compras de mercado/terminal sin comprobante formal
    #                  (pantallazos de WhatsApp, fotos, xls, pdf)
    #   otros          recibos de servicios, municipalidad, multiformato
    # Los ids los rellena init_negocio.py. No los llenes a mano.
    buzon_tipos:
      facturas: ""
      notas_venta: ""
      liquidaciones: ""
      otros: ""

# Modelo de Claude usado por extractores/modelo.py para leer PDF e imágenes.
# "esfuerzo" controla el nivel de esfuerzo de razonamiento (low/medium/high);
# "low" alcanza para lectura de comprobantes y mantiene el costo bajo.
modelo: claude-opus-5
esfuerzo: low

# Una entrada por cada razón social (RUC) que factura a nombre de este
# negocio. "nombre_corto" es el identificador interno: se usa para nombrar
# la carpeta de destino en 01_PROCESADO (los espacios se reemplazan por
# guion bajo) y para las columnas de los Sheets. Debe ser estable: si lo
# cambias después de la primera corrida, los comprobantes viejos y los
# nuevos quedarán con nombres de empresa distintos.
# "razon_social" es el nombre legal completo tal como figura en SUNAT.
# "ruc" va entre comillas para que YAML no lo trate como número (perdería
# ceros a la izquierda). "locales" es la lista de locales físicos que
# facturan bajo este RUC; puede quedar vacía ([]) si el RUC no tiene local
# propio (por ejemplo, una razón social usada solo para compras generales).
empresas:
  - nombre_corto: LA CALETA CENTRO
    razon_social: LA CALETA CENTRO S.A.C.
    ruc: "20123456789"
    locales: [CENTRO]
  - nombre_corto: LA CALETA NORTE
    razon_social: INVERSIONES LA CALETA NORTE S.A.C.
    ruc: "20198765432"
    locales: [NORTE, NORTE2]
    # OBLIGATORIO cuando la empresa tiene MAS DE UN local.
    # Un comprobante nunca dice a que local corresponde: se emite a nombre de
    # la razon social, no del establecimiento. El local es conocimiento de
    # quien compra, no un dato del documento. Sin este valor TODOS los
    # comprobantes de esta empresa irian a 02_REVISAR pidiendo asignacion
    # manual y el sistema dejaria de ser util. Pon aqui el local que compra
    # la mayor parte del tiempo; los pocos del otro local se corrigen a mano
    # en el Sheet.
    local_por_defecto: NORTE

# IDs de los dos Google Sheets del negocio. Se dejan vacíos: init_negocio.py
# crea los Sheets la primera vez que se corre y escribe aquí los IDs
# resultantes. No los llenes a mano salvo que estés reconectando el sistema
# a un Sheet ya existente.
sheets:
  contable: ""
  detalle: ""

# =============================================================================
# Conciliación bancaria
# -----------------------------------------------------------------------------
# Opcional: si el negocio no concilia sus cuentas con este sistema, borra toda
# esta sección. `conciliar.py` genera un .xlsx por empresa y por mes invocando
# al motor vendorizado en `conciliacion/`, y arma sus argumentos desde acá.
#
# "carpeta" es un id de Drive, no una ruta: lo rellena init_negocio.py junto
# con los demás. No lo llenes a mano.
# =============================================================================
conciliacion:
  carpeta: ""
  empresas:
    # Una entrada por cada empresa que tenga cuentas bancarias propias. Una
    # razón social sin cuentas (por ejemplo una usada solo para facturar) se
    # omite: no se concilia.
    - nombre_corto: LA CALETA CENTRO   # debe coincidir con empresas[].nombre_corto
      # String EXACTO que recibe el motor como argumento posicional 'empresa'.
      # No es libre ni cosmético: el motor lo usa para decidir el local y el
      # encargado de la caja chica. Ver conciliacion/build_conciliacion.py.
      nombre_motor: LA CALETA CENTRO
      # Reposición semanal de la caja chica desde el banco. El reporte de
      # egresos del sistema de ventas (--egresos de conciliar.py) se cuadra
      # contra estas salidas. Borra la sección si el negocio no maneja caja
      # chica por reposición.
      caja_chica:
        reposicion_semanal: 250
      cuentas:
        # "numero": los últimos dígitos con los que el banco nombra el archivo
        # del estado de cuenta (EC_1234_062026.pdf). Es el criterio con el que
        # conciliar.py sabe qué EECC pertenece a qué empresa, así que tiene que
        # ser el que aparece en el nombre del archivo, no el número completo de
        # la cuenta.
        # "principal": la cuenta que va como argumento posicional del motor;
        # las demás entran con --eecc. Marca solo una por empresa.
        - banco: interbank
          numero: "1234"
          moneda: PEN
          principal: true
        - banco: bbva
          numero: "5678"
          moneda: PEN
    - nombre_corto: LA CALETA NORTE
      nombre_motor: LA CALETA NORTE
      cuentas:
        - banco: interbank
          numero: "9012"
          moneda: PEN
          principal: true

# =============================================================================
# Correo (Gmail) — SOLO LECTURA
# -----------------------------------------------------------------------------
# Cuarta vía de entrada: estados de cuenta del banco, constancias de
# transferencia y comprobantes que llegan por correo. El sistema NUNCA escribe,
# responde ni borra correo, y no guarda el cuerpo de ningún mensaje.
#
# Importante: el permiso de Gmail que otorga Google abarca TODO el buzón — no
# existe un permiso por etiqueta ni por remitente. Por eso la cuenta del Paso 0
# debe ser exclusiva del negocio, y por eso el acotamiento se hace acá, con
# consultas explícitas y topes de volumen.
# =============================================================================
correo:
  # Déjalo en false hasta tener a la vista un correo real de cada tipo con el
  # cual afinar las consultas de abajo. En false no se consulta Gmail.
  habilitado: false
  # Topes por corrida: ventana de días hacia atrás y máximo de mensajes a mirar.
  dias_atras: 45
  max_mensajes: 200
  reglas:
    # Cada regla es una consulta con la sintaxis de búsqueda de Gmail (la misma
    # que escribirías en la barra de búsqueda) más un destino.
    #
    # tipo: "adjunto"  -> baja los adjuntos cuya extensión esté en la lista y
    #                     los deja en la carpeta de Drive indicada en destino.
    # tipo: "constancia_interbank" -> no hay adjunto: los datos vienen en el
    #                     cuerpo. Se extraen fecha, monto, beneficiario y cuenta
    #                     de cargo, y se escribe cons_<cuenta>.json. El cuerpo
    #                     no se guarda.
    #
    # destino: EECC | CONSTANCIAS | BUZON. "BUZON" hace que un comprobante que
    # llega por correo entre exactamente por el mismo camino que uno arrastrado
    # a mano a 00_BUZON.
    - nombre: eecc-banco
      tipo: adjunto
      destino: EECC
      consulta: "from:banco.com.pe subject:(estado de cuenta) has:attachment"
      extensiones: [".pdf", ".xls", ".xlsx"]
    - nombre: comprobantes-proveedores
      tipo: adjunto
      destino: BUZON
      consulta: "subject:(factura OR boleta OR comprobante) has:attachment"
      extensiones: [".xml", ".pdf"]
